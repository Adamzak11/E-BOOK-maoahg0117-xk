<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video AI Dari Zero – E-book Beginner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style id="css">
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #000000;
  --surface: #0E0E0E;
  --ink: #FFFFFF;
  --muted: #BDBDBD;
  --line: #2B2B2B;
  --edge: #444444;
  --yellow: #FFE600;
  --green: #FFE600;
  --on-yellow: #000000;
  --neon-edge: #FFE600;
  --block: #0A0A0A;
  --on-block: #FFFFFF;
  --block-edge: rgba(255, 230, 0, .5);
  --note-bg: rgba(255, 230, 0, .09);
  --note-line: #FFE600;
  --focus: #FFE600;
  --glow: 0 0 16px rgba(255, 230, 0, .5);
  --glow-sm: 0 0 8px rgba(255, 230, 0, .55);
  --txt-glow: 0 0 14px rgba(255, 230, 0, .55);
  --cover-bg: #000000;
  --grid: rgba(255, 230, 0, .14);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #0A0A0A;
  --muted: #454545;
  --line: #D9D9D9;
  --edge: #0A0A0A;
  --yellow: #FFE600;
  --green: #0A0A0A;
  --on-yellow: #0A0A0A;
  --neon-edge: #0A0A0A;
  --block: #0A0A0A;
  --on-block: #FFFFFF;
  --block-edge: #0A0A0A;
  --note-bg: #FFF8B8;
  --note-line: #0A0A0A;
  --focus: #0B5FFF;
  --glow: 5px 5px 0 #0A0A0A;
  --glow-sm: 3px 3px 0 #0A0A0A;
  --txt-glow: none;
  --cover-bg: #FFE600;
  --grid: rgba(0, 0, 0, .14);
  color-scheme: light;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 120px); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 1.125rem;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 {
  font-family: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  line-height: 1.15;
  margin: 0;
}

/* Top bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 11;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 6px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 56px;
}
.bar-title { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 1.05rem; }
.progress { height: 5px; background: var(--line); }
.progress > i { display: block; height: 100%; width: 0; background: var(--yellow); }
.btn {
  min-height: 44px;
  min-width: 44px;
  padding: 8px 16px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--yellow);
  color: var(--on-yellow);
  font: inherit;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Plaid (kain pelikat) */
.pelikat {
  background-color: var(--green);
  background-image:
    linear-gradient(90deg, rgba(242,183,5,.34) 0 20px, transparent 20px 40px),
    linear-gradient(0deg, rgba(242,183,5,.34) 0 20px, transparent 20px 40px),
    linear-gradient(90deg, transparent 0 28px, rgba(255,255,255,.4) 28px 30px, transparent 30px 40px),
    linear-gradient(0deg, transparent 0 28px, rgba(255,255,255,.4) 28px 30px, transparent 30px 40px);
  background-size: 40px 40px;
}
.strip { height: 14px; }

/* Cover */
.cover { padding: 36px 16px 44px; }
.cover-panel {
  max-width: 640px;
  margin: 0 auto;
  background: var(--bg);
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 28px 22px 26px;
}
.cover h1 { font-size: clamp(2.3rem, 9vw, 3.6rem); font-weight: 800; letter-spacing: -0.02em; }
.cover p.sub { margin: 14px 0 18px; font-size: 1.2rem; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
.tools li { border: 2px solid var(--ink); border-radius: 999px; padding: 4px 14px; font-weight: 700; background: var(--surface); }
.credit { margin: 0; font-size: .95rem; color: var(--muted); }

/* Layout */
main { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
section { padding-top: 40px; }
.toc { padding-top: 32px; }
.toc ol { list-style: none; margin: 14px 0 0; padding: 0; counter-reset: bab; }
.toc li { counter-increment: bab; border-top: 1px solid var(--line); }
.toc li:last-child { border-bottom: 1px solid var(--line); }
.toc a {
  display: flex; align-items: center; gap: 14px;
  min-height: 52px; padding: 8px 0;
  color: var(--ink); text-decoration: none; font-weight: 700;
}
.toc a::before {
  content: counter(bab);
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-weight: 800; font-size: 1.4rem; width: 1.6rem; color: var(--green);
}

h2 { font-size: clamp(1.7rem, 6vw, 2.2rem); font-weight: 800; letter-spacing: -0.01em; margin-bottom: 14px; display: flex; gap: 14px; align-items: baseline; }
h2 .num { font-size: 2.6rem; color: var(--green); line-height: 1; min-width: 1.4rem; }
h3 { font-size: 1.25rem; font-weight: 800; margin: 26px 0 8px; }
p { margin: 0 0 14px; max-width: 68ch; }
ul.ticks { list-style: none; padding: 0; margin: 0 0 14px; }
ul.ticks li { padding: 6px 0 6px 34px; position: relative; }
ul.ticks li::before { content: "✔"; position: absolute; left: 0; top: 6px; color: var(--green); font-weight: 700; }

/* Steps */
ol.steps { list-style: none; counter-reset: s; margin: 10px 0 18px; padding: 0; }
ol.steps li { counter-increment: s; position: relative; padding: 4px 0 14px 52px; }
ol.steps li::before {
  content: counter(s);
  position: absolute; left: 0; top: 0;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--yellow); color: var(--on-yellow);
  border: 2px solid var(--ink);
  display: grid; place-items: center; font-weight: 700;
}

/* Callouts */
.note {
  background: var(--note-bg);
  border-left: 6px solid var(--note-line);
  border-radius: 6px;
  padding: 14px 16px;
  margin: 18px 0;
}
.note strong { display: block; margin-bottom: 4px; }
.note p:last-child { margin-bottom: 0; }

/* Prompt blocks */
.prompt { background: var(--block); color: var(--on-block); border-radius: 12px; margin: 14px 0 20px; overflow: hidden; }
.prompt-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 8px 0 16px; font-weight: 700; font-size: .95rem; }
.prompt pre {
  margin: 0; padding: 10px 16px 16px;
  white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: .98rem; line-height: 1.6;
}

/* Tables / lists of elements */
.elements { margin: 12px 0 18px; padding: 0; list-style: none; }
.elements li { padding: 12px 0; border-top: 1px solid var(--line); }
.elements li:last-child { border-bottom: 1px solid var(--line); }
.elements b { display: block; }
.elements .eg { color: var(--muted); }
.opt { display: inline-block; margin-left: 8px; padding: 0 8px; border: 1px solid var(--muted); border-radius: 999px; font-size: .85rem; color: var(--muted); font-weight: 400; }

/* Two-up comparison */
.pair { display: grid; gap: 12px; grid-template-columns: 1fr; margin: 14px 0; }
@media (min-width: 560px) { .pair { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 14px 16px; }
.card h3 { margin-top: 0; }
.card p:last-child { margin-bottom: 0; }

[hidden] { display: none !important; }
/* Builder */
.builder { background: var(--surface); border: 3px solid var(--ink); border-radius: 14px; padding: 18px 16px 16px; margin: 22px 0; }
.builder h3 { margin-top: 0; }
.field { margin: 0 0 14px; }
.field label { display: block; font-weight: 700; margin-bottom: 4px; }
.field input[type="text"], .field input[type="number"], .field textarea, .field select {
  width: 100%; min-height: 48px; padding: 10px 12px;
  font: inherit; font-size: 1.05rem;
  color: var(--ink); background: var(--bg);
  border: 2px solid var(--ink); border-radius: 10px;
}
.field textarea { min-height: 72px; resize: vertical; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 700; }
.check input { width: 24px; height: 24px; accent-color: var(--green); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.empty { color: var(--muted); margin: 0; padding: 12px 16px 16px; font-family: inherit; }

.summary { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 16px; margin-top: 16px; }
.summary ul { margin: 0; padding-left: 22px; }
.summary li { margin-bottom: 8px; }

footer { max-width: 720px; margin: 0 auto; padding: 8px 16px 40px; color: var(--muted); font-size: .95rem; }
footer p { margin-bottom: 8px; }

.legend { list-style: none; margin: 10px 0 14px; padding: 0; display: grid; gap: 4px; }
.legend li { display: flex; align-items: center; gap: 12px; min-height: 38px; }
.chip { flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: rgb(var(--c)); color: #14261B; font-weight: 700; font-size: .95rem; }
.chip.opt { background: transparent; border: 2px dashed rgb(var(--c)); color: var(--ink); }
.m { background: rgba(var(--c), .28); border-bottom: 2px solid rgb(var(--c)); border-radius: 3px; padding: 0 2px; }
.m::after { content: attr(data-n); font-size: .72em; font-weight: 700; vertical-align: super; margin-left: 3px; color: rgb(var(--c)); }
.m.o { background: none; border-bottom: 2px dashed rgb(var(--c)); }
fieldset.modes { border: 0; padding: 0; margin: 0 0 14px; }
fieldset.modes legend { font-weight: 700; padding: 0; margin-bottom: 2px; }
.field[hidden] { display: none; }
figure.shot { margin: 14px 0 18px; }
figure.shot img { display: block; width: 100%; height: auto; border-radius: 12px; border: 2px solid var(--ink); }
figure.shot figcaption { margin-top: 8px; font-size: .95rem; color: var(--muted); }
figure.vid { margin: 16px 0 18px; }
figure.vid video { display: block; width: 100%; max-width: 320px; height: auto; margin: 0 auto; border-radius: 12px; border: 2px solid var(--ink); background: #000; }
figure.vid figcaption { margin-top: 8px; font-size: .95rem; color: var(--muted); text-align: center; }
.links { display: grid; gap: 10px; margin: 16px 0 6px; }
a.btn { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; line-height: 1.3; }
@media (min-width: 560px) { .links.two { grid-template-columns: 1fr 1fr; } }
.prompt .label { font-weight: 400; }

/* Tema: kuning, putih, hitam neon */
.pelikat { background-color: var(--cover-bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 32px 32px; }
.pelikat.strip { background-color: #FFE600; background-image: repeating-linear-gradient(135deg, #FFE600 0 12px, #000000 12px 24px); background-size: auto; }
.cover-panel { border: 2px solid var(--neon-edge); box-shadow: var(--glow); }
.cover h1 { text-shadow: var(--txt-glow); }
.tools li { border-color: var(--neon-edge); background: var(--surface); }
.progress > i { background: #FFE600; box-shadow: var(--glow-sm); }
.btn { border-color: var(--neon-edge); }
.btn:hover { box-shadow: var(--glow-sm); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--edge); }
.btn.ghost:hover { border-color: var(--neon-edge); }
.card, .summary { border-color: var(--edge); background: var(--surface); }
.builder { border-color: var(--neon-edge); box-shadow: var(--glow); }
.field input[type="text"], .field input[type="number"], .field textarea, .field select { border-color: var(--edge); }
.field input[type="text"]:focus, .field input[type="number"]:focus, .field textarea:focus, .field select:focus { border-color: var(--neon-edge); box-shadow: var(--glow-sm); }
figure.shot img, figure.vid video { border-color: var(--edge); }
ol.steps li::before { border-color: var(--neon-edge); box-shadow: var(--glow-sm); }
h2 .num { text-shadow: var(--txt-glow); }
.prompt { border: 1px solid var(--block-edge); }
.note { border-left-color: var(--note-line); }
.logo { display: block; width: 112px; height: 112px; border-radius: 20px; object-fit: cover; border: 2px solid var(--neon-edge); box-shadow: var(--glow); margin: 0 0 16px; }
.bar-brand { display: flex; align-items: center; gap: 10px; }
.bar-logo { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; border: 2px solid var(--neon-edge); }
.meta { margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-weight: 700; }
.ver { background: var(--yellow); color: var(--on-yellow); padding: 2px 14px; border-radius: 999px; border: 2px solid var(--neon-edge); font-weight: 800; }
.credit b { color: var(--ink); }
.foot { display: flex; align-items: center; gap: 12px; }
.foot-logo { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; border: 2px solid var(--neon-edge); flex: none; }
.foot p { margin: 0; }
.beginner { display: inline-block; margin: 0 0 12px; padding: 4px 14px; background: var(--yellow); color: var(--on-yellow); border: 2px solid var(--neon-edge); border-radius: 8px; font-weight: 800; box-shadow: var(--glow-sm); }
.bar-brand { min-width: 0; flex: 1 1 auto; }
.bar-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.lang { display: flex; gap: 4px; }
.lang-btn { min-width: 44px; padding: 6px 8px; font-size: .95rem; }
.lang-btn[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); border-color: var(--neon-edge); }
#themeBtn { font-size: 1.25rem; padding: 6px 10px; }

.settings-menu { position: absolute; right: 12px; top: calc(100% + 6px); z-index: 70; min-width: 200px; background: var(--surface); border: 2px solid var(--neon-edge); border-radius: 12px; padding: 6px; box-shadow: var(--glow); }
.settings-menu .btn { width: 100%; }
#settingsBtn { font-size: 1.25rem; padding: 6px 10px; }
.login-ov { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.login-card { width: 100%; max-width: 420px; background: var(--surface); color: var(--ink); border: 3px solid var(--neon-edge); border-radius: 18px; padding: 22px; box-shadow: var(--glow); }
.login-card h3 { margin-top: 0; }
.field input[type="password"] { width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--bg); border: 2px solid var(--edge); border-radius: 10px; }
.field input[type="password"]:focus { border-color: var(--neon-edge); box-shadow: var(--glow-sm); }

.ticker { display: none; align-items: center; gap: 10px; padding: 6px 12px; background: var(--surface); border-top: 1px solid var(--line); max-width: 100%; }
.ticker.on { display: flex; }
.ticker-label { flex: none; background: var(--yellow); color: var(--on-yellow); font-weight: 800; font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--neon-edge); }
.ticker-win { overflow: hidden; flex: 1; min-width: 0; white-space: nowrap; -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.ticker-track { display: inline-block; padding-left: 100%; font-weight: 700; animation: tick var(--dur, 20s) linear infinite; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-100%); } }
.ticker-win:hover .ticker-track, .ticker-win:active .ticker-track { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; padding-left: 0; white-space: normal; } .ticker-win { white-space: normal; -webkit-mask-image: none; mask-image: none; } }
.admin-fab { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 50; box-shadow: var(--glow); }
.admin-panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; max-height: 88vh; overflow: auto; background: var(--surface); color: var(--ink); border-top: 3px solid var(--neon-edge); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .6); }
.admin-inner { max-width: 720px; margin: 0 auto; }
.admin-inner h3 { margin-top: 0; }
.ann-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.ann-row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ann-row small { display: block; color: var(--muted); }
.admin-status { min-height: 1.5em; margin: 10px 0 0; font-weight: 700; }
</style>
</head>

  <section id="bab1">
    <h2 data-en="&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;Why start with AI video"><span class="num">1</span>Kenapa mula dengan video AI</h2>
    <p data-en="The content world is changing fast. Many people have started using AI to produce videos that are engaging, consistent and easier to make.">Dunia content berubah dengan sangat pantas. Ramai orang sudah mula guna AI untuk hasilkan video yang menarik, konsisten dan lebih mudah dibuat.</p>
    <p data-en="You don’t need an expensive camera, you don’t need to be good at editing and you don’t need years of experience. With the right techniques and tools, you can:">Anda tak perlu kamera mahal, tak perlu mahir editing dan tak perlukan pengalaman bertahun-tahun. Dengan teknik dan tool yang betul, anda boleh:</p>
    <ul class="ticks">
      <li data-en="Make your own AI videos even if you’re just starting">Hasilkan video AI sendiri walaupun baru bermula</li>
      <li data-en="Create content for affiliate marketing and online business">Buat content untuk affiliate dan bisnes online</li>
      <li data-en="Level up the digital skills that are needed today">Tingkatkan kemahiran digital yang diperlukan hari ini</li>
      <li data-en="Save time and energy when making videos">Jimat masa dan tenaga dalam proses buat video</li>
    </ul>
    <p data-en="This e-book shows you, step by step, how to make your first AI video, from idea, script and visuals to being ready to post.">E-book ini tunjukkan langkah demi langkah cara hasilkan video AI pertama anda, daripada idea, skrip dan visual sehingga siap untuk dipost.</p>
  </section>

  <section id="bab2">
    <h2 data-en="&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;Three tools, one workflow"><span class="num">2</span>Tiga tool, satu aliran kerja</h2>
    <div class="pair" style="grid-template-columns: 1fr;">
      <div class="card"><h3>ChatGPT</h3><p data-en="Write the video prompt from your idea.">Tulis prompt video daripada idea anda.</p></div>
      <div class="card"><h3>Flow</h3><p data-en="Generate video from the prompt. Images can also be generated in Flow. Video models: Omni Flash and Veo. Image model: Nano Banana.">Jana video daripada prompt tersebut. Gambar juga boleh dijana dalam Flow. Model video: Omni Flash dan Veo. Model gambar: Nano Banana.</p></div>
      <div class="card"><h3>CapCut</h3><p data-en="Merge the video scenes generated in Flow.">Gabungkan scene video yang telah dijana dalam Flow.</p></div>
    </div>
    <h3 data-en="Your first video workflow">Aliran kerja video pertama</h3>
    <ol class="steps">
      <li data-en="Open ChatGPT and ask for a video prompt based on your idea.">Buka ChatGPT dan minta prompt video berdasarkan idea anda.</li>
      <li data-en="Once you have the prompt, go into Flow to make the video.">Selepas dapat prompt, masuk Flow untuk membuat video.</li>
      <li data-en="If you want to combine several videos, open CapCut and merge them there.">Kalau mahu gabungkan beberapa video, buka CapCut dan gabungkan di situ.</li>
    </ol>
    <div class="note">
      <strong data-en="Changes in Flow">Perubahan pada Flow</strong>
      <p data-en="The Text to video function is gone, but you can still make a video from a prompt alone. See Chapter 5. ChatGPT and CapCut stay the same.">Fungsi Text to video sudah tiada, tetapi anda masih boleh buat video daripada prompt sahaja. Lihat Bab 5. ChatGPT dan CapCut kekal sama.</p>
    </div>
    <div class="links"><a class="btn" href="https://youtube.com/playlist?list=PLFbK7TAHhUTujq7VW2wHZjJAkbtkvVV6w&amp;si=qa4RWrKyq0GUDAE1" target="_blank" rel="noopener noreferrer" data-en="Watch the tutorial video">Tengok video tutorial</a></div>
  </section>

  <div class="strip pelikat" aria-hidden="true"></div>

  <section id="bab3">
    <h2 data-en="&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;Basic elements of a prompt"><span class="num">3</span>Elemen asas dalam prompt</h2>
    <p data-en="Basic elements are the things a prompt must have. Optional elements are added based on your own ideas.">Elemen asas ialah perkara yang mesti ada dalam prompt. Elemen pilihan pula anda tambah ikut idea sendiri.</p>

    <h3 data-en="Video prompt">Prompt video</h3>
    <p data-en="What must be included:">Perkara yang mesti ada:</p>
    <ul class="legend">
      <li data-en="&lt;span class=&quot;chip&quot; style=&quot;--c:242,183,5&quot;&gt;1&lt;/span&gt;The AI model you want to use"><span class="chip" style="--c:242,183,5">1</span>Model AI yang mahu digunakan</li>
      <li data-en="&lt;span class=&quot;chip&quot; style=&quot;--c:79,195,247&quot;&gt;2&lt;/span&gt;Character"><span class="chip" style="--c:79,195,247">2</span>Karakter</li>
      <li data-en="&lt;span class=&quot;chip&quot; style=&quot;--c:129,199,132&quot;&gt;3&lt;/span&gt;Age"><span class="chip" style="--c:129,199,132">3</span>Umur</li>
      <li data-en="&lt;span class=&quot;chip&quot; style=&quot;--c:255,138,101&quot;&gt;4&lt;/span&gt;Ethnicity"><span class="chip" style="--c:255,138,101">4</span>Bangsa</li>
      <li data-en="&lt;span class=&quot;chip&quot; style=&quot;--c:186,104,200&quot;&gt;5&lt;/span&gt;Action: what they are doing"><span class="chip" style="--c:186,104,200">5</span>Aksi: dia sedang buat apa</li>
      <li data-en="&lt;span class=&quot;chip&quot; style=&quot;--c:240,98,146&quot;&gt;6&lt;/span&gt;Dialogue"><span class="chip" style="--c:240,98,146">6</span>Dialog</li>
      <li data-en="&lt;span class=&quot;chip&quot; style=&quot;--c:77,208,225&quot;&gt;7&lt;/span&gt;Video style: real or cartoon"><span class="chip" style="--c:77,208,225">7</span>Style video: real atau kartun</li>
      <li data-en="&lt;span class=&quot;chip&quot; style=&quot;--c:174,213,129&quot;&gt;8&lt;/span&gt;Camera style"><span class="chip" style="--c:174,213,129">8</span>Gaya kamera</li>
    </ul>
    <p data-en="Optional elements, add based on your own ideas:">Elemen pilihan, tambah mengikut idea sendiri:</p>
    <ul class="legend">
      <li data-en="&lt;span class=&quot;chip opt&quot; style=&quot;--c:144,164,174&quot;&gt;a&lt;/span&gt;Location"><span class="chip opt" style="--c:144,164,174">a</span>Lokasi</li>
      <li data-en="&lt;span class=&quot;chip opt&quot; style=&quot;--c:144,164,174&quot;&gt;b&lt;/span&gt;Time"><span class="chip opt" style="--c:144,164,174">b</span>Masa</li>
      <li data-en="&lt;span class=&quot;chip opt&quot; style=&quot;--c:144,164,174&quot;&gt;c&lt;/span&gt;Duration"><span class="chip opt" style="--c:144,164,174">c</span>Durasi</li>
      <li data-en="&lt;span class=&quot;chip opt&quot; style=&quot;--c:144,164,174&quot;&gt;+&lt;/span&gt;Character clothing (outfit) and others"><span class="chip opt" style="--c:144,164,174">+</span>Pakaian karakter (outfit) dan lain-lain</li>
    </ul>

    <div class="prompt">
      <div class="prompt-head"><span data-en="Complete video prompt example">Contoh prompt video lengkap</span><button class="btn" type="button" data-copy-target="exVideo" data-en="Copy">Salin</button></div>
      <pre id="exVideo" data-en="Generate a video prompt for &lt;span class=&quot;m&quot; style=&quot;--c:242,183,5&quot; data-n=&quot;1&quot;&gt;Omni Flash&lt;/span&gt; &lt;span class=&quot;m o&quot; style=&quot;--c:144,164,174&quot; data-n=&quot;c&quot;&gt;10s&lt;/span&gt;, a &lt;span class=&quot;m&quot; style=&quot;--c:255,138,101&quot; data-n=&quot;4&quot;&gt;Malay&lt;/span&gt; &lt;span class=&quot;m&quot; style=&quot;--c:79,195,247&quot; data-n=&quot;2&quot;&gt;man&lt;/span&gt; &lt;span class=&quot;m&quot; style=&quot;--c:129,199,132&quot; data-n=&quot;3&quot;&gt;aged 35&lt;/span&gt;, &lt;span class=&quot;m&quot; style=&quot;--c:186,104,200&quot; data-n=&quot;5&quot;&gt;working as a Proton car salesman&lt;/span&gt; and &lt;span class=&quot;m o&quot; style=&quot;--c:144,164,174&quot; data-n=&quot;a&quot;&gt;located at a Proton car showroom in Malaysia&lt;/span&gt; &lt;span class=&quot;m o&quot; style=&quot;--c:144,164,174&quot; data-n=&quot;b&quot;&gt;at midday&lt;/span&gt;, while he is at the showroom, &lt;span class=&quot;m&quot; style=&quot;--c:240,98,146&quot; data-n=&quot;6&quot;&gt;he speaks in Malay “Kalau korang nak beli kereta, meh beli dengan saya, saya beri banyak freegift siapa beli dengan saya”&lt;/span&gt;, &lt;span class=&quot;m&quot; style=&quot;--c:77,208,225&quot; data-n=&quot;7&quot;&gt;Ugc style&lt;/span&gt;, &lt;span class=&quot;m&quot; style=&quot;--c:174,213,129&quot; data-n=&quot;8&quot;&gt;handheld&lt;/span&gt;">Hasilkan prompt video <span class="m" style="--c:242,183,5" data-n="1">Omni Flash</span> <span class="m o" style="--c:144,164,174" data-n="c">10s</span>, seorang <span class="m" style="--c:79,195,247" data-n="2">lelaki</span> <span class="m" style="--c:255,138,101" data-n="4">Melayu</span> <span class="m" style="--c:129,199,132" data-n="3">berusia 35 tahun</span>, <span class="m" style="--c:186,104,200" data-n="5">sedang menjadi salesman kereta proton</span> dan <span class="m o" style="--c:144,164,174" data-n="a">berada di showroom kereta proton di malaysia</span> <span class="m o" style="--c:144,164,174" data-n="b">pada waktu tengah hari</span>, sambil dia sedang berada di showroom dia <span class="m" style="--c:240,98,146" data-n="6">bercakap dalam bahasa melayu “Kalau korang nak beli kereta, meh beli dengan saya, saya beri banyak freegift siapa beli dengan saya”</span>, <span class="m" style="--c:77,208,225" data-n="7">Ugc style</span>, <span class="m" style="--c:174,213,129" data-n="8">handheld</span></pre>
    </div>

    <h3 data-en="Image prompt">Prompt gambar</h3>
    <p data-en="The basic elements are the same as the video prompt, with two differences: there is no dialogue, and the style is an image style (real or cartoon).">Elemen asasnya sama dengan prompt video, dengan dua perbezaan: tiada dialog, dan style pula ialah style gambar (real atau kartun).</p>
    <p data-en="Images can be generated directly in Flow. The AI model for images is &lt;b&gt;Nano Banana&lt;/b&gt;, with the options Pro, 2 Lite and 2.1.">Gambar boleh dijana terus dalam Flow. Model AI untuk gambar ialah <b>Nano Banana</b>, dengan pilihan Pro, 2 Lite dan 2.1.</p>
    <div class="note">
      <strong data-en="An image prompt doesn’t need dialogue">Prompt gambar tidak perlu dialog</strong>
      <p data-en="An image doesn’t speak, so leave out the dialogue element. Everything else is the same as the video prompt.">Gambar tidak bercakap, jadi tinggalkan elemen dialog. Selebihnya sama seperti prompt video.</p>
    </div>
    <div class="prompt">
      <div class="prompt-head"><span data-en="Complete image prompt example">Contoh prompt gambar lengkap</span><button class="btn" type="button" data-copy-target="exImage" data-en="Copy">Salin</button></div>
      <pre id="exImage" data-en="Generate an image prompt for &lt;span class=&quot;m&quot; style=&quot;--c:242,183,5&quot; data-n=&quot;1&quot;&gt;Nano Banana Pro&lt;/span&gt;, a &lt;span class=&quot;m&quot; style=&quot;--c:255,138,101&quot; data-n=&quot;4&quot;&gt;Malay&lt;/span&gt; &lt;span class=&quot;m&quot; style=&quot;--c:79,195,247&quot; data-n=&quot;2&quot;&gt;man&lt;/span&gt; &lt;span class=&quot;m&quot; style=&quot;--c:129,199,132&quot; data-n=&quot;3&quot;&gt;aged 35&lt;/span&gt;, &lt;span class=&quot;m&quot; style=&quot;--c:186,104,200&quot; data-n=&quot;5&quot;&gt;working as a Proton car salesman&lt;/span&gt; and &lt;span class=&quot;m o&quot; style=&quot;--c:144,164,174&quot; data-n=&quot;a&quot;&gt;located at a Proton car showroom in Malaysia&lt;/span&gt; &lt;span class=&quot;m o&quot; style=&quot;--c:144,164,174&quot; data-n=&quot;b&quot;&gt;at midday&lt;/span&gt;, &lt;span class=&quot;m&quot; style=&quot;--c:77,208,225&quot; data-n=&quot;7&quot;&gt;Ugc style&lt;/span&gt;, &lt;span class=&quot;m&quot; style=&quot;--c:174,213,129&quot; data-n=&quot;8&quot;&gt;handheld&lt;/span&gt;">Hasilkan prompt gambar <span class="m" style="--c:242,183,5" data-n="1">Nano Banana Pro</span>, seorang <span class="m" style="--c:79,195,247" data-n="2">lelaki</span> <span class="m" style="--c:255,138,101" data-n="4">Melayu</span> <span class="m" style="--c:129,199,132" data-n="3">berusia 35 tahun</span>, <span class="m" style="--c:186,104,200" data-n="5">sedang menjadi salesman kereta proton</span> dan <span class="m o" style="--c:144,164,174" data-n="a">berada di showroom kereta proton di malaysia</span> <span class="m o" style="--c:144,164,174" data-n="b">pada waktu tengah hari</span>, <span class="m" style="--c:77,208,225" data-n="7">Ugc style</span>, <span class="m" style="--c:174,213,129" data-n="8">handheld</span></pre>
    </div>

    <div class="builder">
      <h3 data-en="Build your instruction for ChatGPT">Susun arahan untuk ChatGPT</h3>
      <p data-en="Fill in the elements below and the full instruction will be put together automatically. Copy it and paste into ChatGPT.">Isi elemen di bawah dan arahan lengkap akan tersusun automatik. Salin dan tampal ke ChatGPT.</p>
      <fieldset class="modes">
        <legend data-en="Prompt type">Jenis prompt</legend>
        <label class="check"><input type="radio" name="fMode" value="video" checked=""> <span data-en="Video prompt">Prompt video</span></label>
        <label class="check"><input type="radio" name="fMode" value="gambar"> <span data-en="Image prompt">Prompt gambar</span></label>
      </fieldset>
      <div class="field"><label for="fModel" data-en="AI model">Model AI</label><input id="fModel" type="text" placeholder="contoh: Omni Flash" data-en-ph="e.g. Omni Flash"></div>
      <div class="field" id="durField"><label for="fDur" data-en="Duration in seconds (optional)">Durasi dalam saat (pilihan)</label><input id="fDur" type="number" inputmode="numeric" min="1" placeholder="contoh: 10" data-en-ph="e.g. 10"></div>
      <div class="field"><label for="fChar" data-en="Character">Karakter</label><input id="fChar" type="text" placeholder="contoh: lelaki" data-en-ph="e.g. man"></div>
      <div class="field"><label for="fRace" data-en="Ethnicity">Bangsa</label><input id="fRace" type="text" placeholder="contoh: Melayu" data-en-ph="e.g. Malay"></div>
      <div class="field"><label for="fAge" data-en="Age">Umur</label><input id="fAge" type="number" inputmode="numeric" min="1" placeholder="contoh: 35" data-en-ph="e.g. 35"></div>
      <div class="field"><label for="fAction" data-en="Action: what they are doing">Aksi: dia sedang buat apa</label><textarea id="fAction" placeholder="contoh: sedang menjadi salesman kereta proton" data-en-ph="e.g. working as a Proton car salesman"></textarea></div>
      <div class="field"><label for="fPlace" data-en="Location (optional)">Lokasi (pilihan)</label><input id="fPlace" type="text" placeholder="contoh: showroom kereta proton di malaysia" data-en-ph="e.g. located at a Proton car showroom in Malaysia"></div>
      <div class="field"><label for="fTime" data-en="Time (optional)">Masa (pilihan)</label><input id="fTime" type="text" placeholder="contoh: waktu tengah hari" data-en-ph="e.g. at midday"></div>
      <div class="field"><label for="fOutfit" data-en="Character clothing (optional)">Pakaian karakter (pilihan)</label><input id="fOutfit" type="text" placeholder="contoh: baju korporat" data-en-ph="e.g. a corporate shirt"></div>
      <div class="field" id="dialogField"><label for="fDialog" data-en="Dialogue">Dialog</label><textarea id="fDialog" placeholder="contoh: Kalau korang nak beli kereta, meh beli dengan saya" data-en-ph="e.g. Kalau korang nak beli kereta, meh beli dengan saya"></textarea></div>
      <div class="field"><label for="fStyle" data-en="Style (real or cartoon)">Style (real atau kartun)</label><select id="fStyle"><option value="" data-en="None">Tiada</option><option value="Ugc style">Real: UGC style</option><option value="3D render cartoon style" data-en="Cartoon: 3D render cartoon style">Kartun: 3D render cartoon style</option></select></div>
      <div class="field"><label for="fCam" data-en="Camera style">Gaya kamera</label><input id="fCam" type="text" placeholder="contoh: handheld" data-en-ph="e.g. handheld"></div>
      <div class="field"><label for="fExtra" data-en="Other (optional)">Lain-lain (pilihan)</label><input id="fExtra" type="text" placeholder="idea tambahan anda" data-en-ph="your extra ideas"></div>
      <label class="check"><input id="fJson" type="checkbox"> <span data-en="Request in JSON format">Minta dalam format JSON</span></label>
      <div class="row">
        <button class="btn ghost" id="fillBtn" type="button" data-en="Fill example">Isi contoh</button>
        <button class="btn ghost" id="clearBtn" type="button" data-en="Clear">Kosongkan</button>
      </div>
      <div class="prompt" id="builderOut">
        <div class="prompt-head"><span data-en="Instruction for ChatGPT">Arahan untuk ChatGPT</span><button class="btn" id="builderCopy" type="button" data-copy-target="builderText" data-en="Copy">Salin</button></div>
        <pre id="builderText" aria-live="polite"></pre>
      </div>
    </div>
  </section>

  <section id="bab4">
    <h2 data-en="&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;Ask ChatGPT for a prompt"><span class="num">4</span>Minta prompt daripada ChatGPT</h2>
    <p data-en="Copy the example instruction in Chapter 3 into ChatGPT, then copy the prompt ChatGPT gives you into Flow.">Salin contoh arahan di Bab 3 ke ChatGPT, kemudian copy prompt yang ChatGPT berikan ke Flow.</p>
    <p data-en="You can also ask ChatGPT for a prompt in JSON format. After writing the AI model, write &lt;b&gt;Format Json&lt;/b&gt; right away, and make sure there is a comma after the AI model.">Anda juga boleh minta ChatGPT bagi prompt dalam format JSON. Selepas menulis model AI, terus tulis <b>Format Json</b>, dan pastikan ada koma selepas model AI.</p>
    <div class="prompt">
      <div class="prompt-head"><span data-en="JSON format instruction example">Contoh arahan format JSON</span><button class="btn" type="button" data-copy-target="ex1" data-en="Copy">Salin</button></div>
      <pre id="ex1" data-en="Generate a video prompt for Omni Flash 10s, &lt;span class=&quot;m o&quot; style=&quot;--c:242,183,5&quot; data-n=&quot;J&quot;&gt;Format Json&lt;/span&gt;, a Malay man aged 35, working as a Proton car salesman and located at a Proton car showroom in Malaysia at midday, while he is at the showroom, he speaks in Malay “Kalau korang nak beli kereta, meh beli dengan saya, saya beri banyak freegift siapa beli dengan saya”, Ugc style, handheld">Hasilkan prompt video Omni Flash 10s, <span class="m o" style="--c:242,183,5" data-n="J">Format Json</span>, seorang lelaki Melayu berusia 35 tahun, sedang menjadi salesman kereta proton dan berada di showroom kereta proton di malaysia pada waktu tengah hari, sambil dia sedang berada di showroom dia bercakap dalam bahasa melayu “Kalau korang nak beli kereta, meh beli dengan saya, saya beri banyak freegift siapa beli dengan saya”, Ugc style, handheld</pre>
    </div>

    <h3 data-en="Normal prompt or JSON prompt">Prompt biasa atau prompt JSON</h3>
    <div class="pair">
      <div class="card"><h3 data-en="Normal prompt">Prompt biasa</h3><p data-en="Like telling a story to a friend.">Macam kita bercerita kepada kawan.</p></div>
      <div class="card"><h3 data-en="JSON format prompt">Prompt format JSON</h3><p data-en="Like giving step-by-step instructions.">Macam kita beri arahan step-by-step.</p></div>
    </div>
    <p data-en="To get JSON format, write &lt;b&gt;Format Json&lt;/b&gt; right after the AI model name. Make sure there is a comma after the AI model and after Format Json, as in the example above.">Untuk dapat format JSON, tulis <b>Format Json</b> terus selepas nama model AI. Pastikan ada koma selepas model AI dan selepas Format Json, seperti dalam contoh di atas.</p>
    <div class="note">
      <strong data-en="Important tip for Veo">Tip penting untuk Veo</strong>
      <p data-en="If the video has dialogue and a lot of action, JSON format is usually more stable.">Kalau video ada dialog dan banyak aksi, format JSON biasanya lebih stabil.</p>
    </div>
  </section>

  <section id="bab5">
    <h2 data-en="&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;Three techniques for making video in Flow"><span class="num">5</span>Tiga teknik buat video di Flow</h2>
    <div class="note">
      <strong data-en="Text to video is no longer a separate function">Text to video tiada fungsi berasingan lagi</strong>
      <p data-en="You can still make a video from a prompt alone with Frame to video or Ingredients to video, you just don’t need to add an image. Refer to the tutorial video for detailed steps.">Anda masih boleh buat video daripada prompt sahaja dengan Frame to video atau Ingredients to video, cuma tak perlu masukkan gambar. Rujuk video panduan untuk langkah terperinci.</p>
    </div>
    <div class="links"><a class="btn" href="https://youtube.com/playlist?list=PLFbK7TAHhUTujq7VW2wHZjJAkbtkvVV6w&amp;si=qa4RWrKyq0GUDAE1" target="_blank" rel="noopener noreferrer" data-en="Watch the tutorial video">Tengok video tutorial</a></div>

    <h3 data-en="Text to video (without an image)">Text to video (tanpa gambar)</h3>
    <ol class="steps">
      <li data-en="Ask ChatGPT for a video prompt.">Minta prompt video daripada ChatGPT.</li>
      <li data-en="Copy that prompt and paste it into Flow, using Frame to video or Ingredients to video without adding an image.">Copy prompt itu dan paste dalam Flow, guna Frame to video atau Ingredients to video tanpa memasukkan gambar.</li>
      <li data-en="Press enter and wait for the result.">Tekan enter dan tunggu hasilnya.</li>
    </ol>

    <h3>Frame to video</h3>
    <p data-en="You make an image first, then use that image as the starting frame of the video.">Anda buat gambar dahulu, kemudian gambar itu dijadikan frame permulaan video.</p>

Jmo/wBxTJkl6DvH8H8lAKOSOqsP4pv9NX6gEE8P7Ez/AOZaauf0VS/xvAA3eUP7NWn3fyOqyw/uvyZ91T96AFRy9u/Ymt/jNjk7/dLlf/mqL7wArk6r0VSe9xvctPR9p7L+SAEGOzfsjdPf/I5YAozUf9rg7Rv1N7lz6XZ2LQCClf2ATtv/AFHJgAdbYv2Wn/zkf3NNh5Uv727l/mYP9tgBeI0uXnp3/wCk3+Zrqz0nB7owCK7HJX9kfKD2VL/vKaHLr0pT9g0Ao3Plk/vEn7Gm/wBppq8v/wC20nYIAEcqdXlv+XbOx/kgBFdvlP6apP8A4apfo4/KbR6UpO2b9QCja5d+n39m0qg/YGXtv5gAbGo/uVpv9ed/sqcndPyaTsgAKqD/ANl9o/6nW+XH9r5/4Yv9poAH5wACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//2Q==" alt="Paparan Frame to video dalam Flow: kotak Start dan End, ruang prompt What do you want to create, dan tetapan Video 720p 10s x1" data-en-alt="Frame to video screen in Flow: the Start and End boxes, the prompt box (What do you want to create), and the Video 720p 10s x1 settings">
      <figcaption data-en="Frame to video screen in Flow: the Start and End boxes, the prompt box, and the settings at the bottom right.">Paparan Frame to video dalam Flow: kotak Start dan End, ruang prompt, dan tetapan di sebelah kanan bawah.</figcaption>
    </figure>
    <ol class="steps">
      <li data-en="Ask ChatGPT for an image prompt.">Minta prompt gambar daripada ChatGPT.</li>
      <li data-en="Copy and paste that prompt into Flow to generate the image.">Copy dan paste prompt itu dalam Flow untuk jana gambar.</li>
      <li data-en="Pick the best image.">Pilih gambar yang terbaik.</li>
      <li data-en="Go back to ChatGPT and ask for a video prompt.">Masuk balik ke ChatGPT dan minta prompt video.</li>
      <li data-en="In Flow, put that image into the &lt;b&gt;Start&lt;/b&gt; box.">Dalam Flow, masukkan gambar tadi ke kotak <b>Start</b>.</li>
      <li data-en="Paste the video prompt into the prompt box, and check the settings at the bottom right (for example Video, 720p, 10s, x1).">Paste prompt video dalam ruang prompt, dan semak tetapan di sebelah kanan bawah (contohnya Video, 720p, 10s, x1).</li>
      <li data-en="Press the arrow button to send and wait for the result.">Tekan butang anak panah untuk hantar dan tunggu hasilnya.</li>
    </ol>
    <div class="note">
      <strong data-en="If you’re making a product video">Kalau buat video produk</strong>
      <p data-en="Don’t just write the product name in the prompt, because the result is sometimes wrong. Follow the tutorial on how to use products in the tutorial video.">Jangan terus tulis nama produk dalam prompt kerana hasilnya kadang-kadang jadi salah. Ikut tutorial cara guna produk dalam video panduan.</p>
    </div>

    <h3>Ingredients to video</h3>
    <p data-en="In this technique, you add &lt;b&gt;reference images&lt;/b&gt; so the AI knows what should be in the video. Each image has a purpose: add a product image if you want the AI to hold your product, or add a face image if you want the AI to use your face.">Dalam teknik ini, anda masukkan <b>gambar rujukan</b> supaya AI tahu apa yang perlu ada dalam video. Setiap gambar ada tujuan: masukkan gambar produk jika mahu AI memegang produk anda, atau masukkan gambar muka jika mahu AI menggunakan muka anda.</p>
    <div class="note">
      <strong data-en="The result is less consistent">Hasilnya kurang konsisten</strong>
      <p data-en="This method looks less polished and the video is sometimes not accurate. If you want to make a video using a product, or a product together with your own face in one video, follow the method in the tutorial video.">Cara ini kurang cantik dan video kadang-kadang tidak accurate. Kalau anda mahu buat video guna produk, atau produk bersama muka sendiri dalam satu video, ikut cara dalam video panduan.</p>
    </div>

    <h3 data-en="The difference between Frame to video and Ingredients to video">Beza Frame to video dan Ingredients to video</h3>
    <p data-en="Frame to video uses an image as the starting frame of the video. Ingredients to video instead uses reference images (for example a product and a face) so the AI puts them into the video, but the result is less consistent. Refer to the latest tutorial video for a detailed explanation.">Frame to video menjadikan gambar sebagai frame permulaan video. Ingredients to video pula guna gambar rujukan (contohnya produk dan muka) supaya AI memasukkannya ke dalam video, tetapi hasilnya kurang konsisten. Rujuk video panduan terkini untuk penerangan terperinci.</p>
  </section>

  <section id="bab6">
    <h2 data-en="&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;Video styles: real and animation"><span class="num">6</span>Style video: real dan animation</h2>
    <p data-en="There are two types of video style: &lt;b&gt;real&lt;/b&gt; and &lt;b&gt;animation&lt;/b&gt;.">Ada dua jenis style video: <b>real</b> dan <b>animation</b>.</p>
    <ul class="ticks">
      <li data-en="Real style: you can add &lt;b&gt;UGC style&lt;/b&gt;.">Style real: boleh masukkan <b>UGC style</b>.</li>
      <li data-en="Animation style (like cartoon): you can try &lt;b&gt;3D render cartoon style&lt;/b&gt;.">Style animation (macam kartun): boleh cuba <b>3D render cartoon style</b>.</li>
    </ul>
    <p data-en="For a cartoon style, add that style when asking ChatGPT for the prompt.">Untuk style kartun, tambah style itu semasa meminta prompt daripada ChatGPT.</p>
    <div class="prompt">
      <div class="prompt-head"><span data-en="Addition to the instruction">Tambahan pada arahan</span><button class="btn" type="button" data-copy-target="ex2" data-en="Copy">Salin</button></div>
      <pre id="ex2">3D render cartoon style</pre>
    </div>
    <ol class="steps">
      <li data-en="Ask ChatGPT for an image prompt, with 3D render cartoon style.">Minta prompt gambar daripada ChatGPT, dengan 3D render cartoon style.</li>
      <li data-en="Copy and paste into Flow to generate the image.">Copy dan paste dalam Flow untuk jana gambar.</li>
      <li data-en="Go back to ChatGPT and ask for a video prompt. Use the same chat, not a new chat.">Masuk ChatGPT semula dan minta prompt video. Guna chat yang sama, bukan new chat.</li>
      <li data-en="Copy and paste the video prompt into Flow, then put the image generated earlier in as the starting frame (Frame to video).">Copy dan paste prompt video dalam Flow, kemudian masukkan gambar yang dijana tadi sebagai frame permulaan (Frame to video).</li>
    </ol>
  </section>

  <section id="bab7">
    <h2 data-en="&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;Merge scenes in CapCut"><span class="num">7</span>Gabung scene dalam CapCut</h2>
    <p data-en="After you finish making videos in Flow, open CapCut if you want to merge several videos into one.">Selepas siap membuat video di Flow, buka CapCut jika anda mahu gabungkan beberapa video menjadi satu.</p>
    <figure class="vid">
      <video controls="" playsinline="" preload="metadata" src="gabung-scene-capcut.mp4">Pelayar anda tidak menyokong video ini.</video>
      <figcaption data-en="Video: how to merge scene by scene in CapCut">Video: cara gabung scene demi scene dalam CapCut</figcaption>
    </figure>
    <div class="note">
      <strong data-en="The full steps are in the video">Langkah penuh ada dalam video</strong>
      <p data-en="CapCut stays the same as before: use it to merge the video scenes generated in Flow. Watch the video above for the step-by-step.">CapCut kekal sama seperti sebelum ini: gunakannya untuk gabungkan scene video yang telah dijana dalam Flow. Tonton video di atas untuk langkah demi langkah.</p>
    </div>
  </section>

  <section id="bab8">
    <h2 data-en="&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;Summary and next steps"><span class="num">8</span>Ringkasan dan langkah seterusnya</h2>
    <div class="summary">
      <ul>
        <li data-en="Use ChatGPT to write prompts, Flow (Omni Flash or Veo model) to generate video, and CapCut to merge scenes.">Gunakan ChatGPT untuk tulis prompt, Flow (model Omni Flash atau Veo) untuk jana video dan CapCut untuk gabung scene.</li>
        <li data-en="A video prompt needs the AI model, character (age, ethnicity), action, dialogue, video style and camera style. Location, time and outfit are optional. An image prompt is the same, but doesn’t need dialogue.">Prompt video perlu ada model AI, karakter (umur, bangsa), aksi, dialog, style video dan gaya kamera. Lokasi, masa dan outfit ialah pilihan. Prompt gambar sama, tetapi tidak perlu dialog.</li>
        <li data-en="For JSON format, write &lt;b&gt;Format Json&lt;/b&gt; right after the AI model. JSON is more stable when there is dialogue and a lot of action.">Untuk format JSON, tulis <b>Format Json</b> terus selepas model AI. JSON lebih stabil bila ada dialog dan banyak aksi.</li>
        <li data-en="There are three techniques: Text to video, Frame to video and Ingredients to video. Text to video has no separate function, but can be done with the other two techniques without adding an image.">Ada tiga teknik: Text to video, Frame to video dan Ingredients to video. Text to video tiada fungsi berasingan, tetapi boleh dibuat dengan dua teknik lagi tanpa memasukkan gambar.</li>
        <li data-en="There are two styles: real (you can add UGC style) and animation (try 3D render cartoon style).">Ada dua style: real (boleh masukkan UGC style) dan animation (cuba 3D render cartoon style).</li>
        <li data-en="ChatGPT and CapCut stay the same. For detailed steps in Flow, refer to the tutorial video.">ChatGPT dan CapCut kekal sama. Untuk langkah terperinci dalam Flow, rujuk video panduan.</li>
      </ul>
    </div>
    <h3 data-en="What’s in the full kit">Apa yang ada dalam kit penuh</h3>
    <ul class="ticks">
      <li>E-book</li>
      <li data-en="New tutorial video (latest version)">Video panduan baharu (versi terkini)</li>
      <li>Group support</li>
      <li data-en="Prompt group, including the Omni Prompt generator">Group arahan prompt, termasuk Omni Prompt generator</li>
      <li>Master prompt affiliate</li>

        <li data-en="Look for the &lt;b&gt;pinned message&lt;/b&gt;. The prompt group link is there.">Cari <b>mesej yang di-pin</b> (pinned message). Pautan group prompt ada di situ.</li>
        <li data-en="Join the &lt;b&gt;prompt group&lt;/b&gt;.">Join <b>group prompt</b>.</li>

      if (v('fAge')) who += ' berusia ' + v('fAge') + ' tahun';
      act = v('fAction');
      if (v('fPlace')) act += ' dan berada di ' + v('fPlace');
      if (v('fTime')) act += ' pada ' + v('fTime');
      parts = [who, act];
      if (v('fOutfit')) parts.push('memakai ' + v('fOutfit'));
      if (isVideo && v('fDialog')) parts.push('dia bercakap dalam bahasa melayu \u201C' + v('fDialog') + '\u201D');
    }
    if (v('fStyle')) parts.push(v('fStyle'));
    if (v('fCam')) parts.push(v('fCam'));
    if (v('fExtra')) parts.push(v('fExtra'));
    text = head + ($('fJson').checked ? ', Format Json' : '') + ', ' + parts.join(', ');
    out.textContent = text;
  }

  fieldIds.concat(['fJson']).forEach(function (id) {
    $(id).addEventListener('input', build);
    $(id).addEventListener('change', build);
  });
  document.querySelectorAll('input[name="fMode"]').forEach(function (r) {
    r.addEventListener('change', build);
  });

  $('fillBtn').addEventListener('click', function () {
    var en = LANG === 'en';
    document.querySelector('input[name="fMode"][value="video"]').checked = true;
    $('fModel').value = 'Omni Flash';
    $('fDur').value = '10';
    $('fChar').value = en ? 'man' : 'lelaki';
    $('fRace').value = en ? 'Malay' : 'Melayu';
    $('fAge').value = '35';
    $('fAction').value = en ? 'working as a Proton car salesman' : 'sedang menjadi salesman kereta proton';
    $('fPlace').value = en ? 'located at a Proton car showroom in Malaysia' : 'showroom kereta proton di malaysia';
    $('fTime').value = en ? 'at midday' : 'waktu tengah hari';
    $('fOutfit').value = '';
    $('fDialog').value = 'Kalau korang nak beli kereta, meh beli dengan saya, saya beri banyak freegift siapa beli dengan saya';
    $('fStyle').value = 'Ugc style';
    $('fCam').value = 'handheld';
    $('fExtra').value = '';
    build();
  });
  $('clearBtn').addEventListener('click', function () {
    fieldIds.forEach(function (id) { $(id).value = ''; });
    build();
  });

  // Language (BM / EN)
  function swapAttr(enAttr, msAttr, realAttr, toEn) {
    document.querySelectorAll('[' + enAttr + ']').forEach(function (el) {
      if (!el.hasAttribute(msAttr)) el.setAttribute(msAttr, el.getAttribute(realAttr) || '');
      el.setAttribute(realAttr, toEn ? el.getAttribute(enAttr) : el.getAttribute(msAttr));
    });
  }
  function applyLang(l) {
    LANG = l === 'en' ? 'en' : 'ms';
    var toEn = LANG === 'en';
    root.lang = toEn ? 'en' : 'ms';
    document.querySelectorAll('[data-en]').forEach(function (el) {
      if (!el.hasAttribute('data-ms')) el.setAttribute('data-ms', el.innerHTML);
      el.innerHTML = toEn ? el.getAttribute('data-en') : el.getAttribute('data-ms');
    });
    swapAttr('data-en-ph', 'data-ms-ph', 'placeholder', toEn);
    swapAttr('data-en-aria', 'data-ms-aria', 'aria-label', toEn);
    swapAttr('data-en-alt', 'data-ms-alt', 'alt', toEn);
    document.title = STR[LANG].title;
    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === LANG ? 'true' : 'false');
    });
    build();
    renderTicker();
  }
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var l = b.getAttribute('data-lang');
      if (l === LANG) return;
      applyLang(l);
      try { localStorage.setItem('ebook-lang', l); } catch (e) {}
    });
  });

  var savedLang = 'ms';
  try { var sl = localStorage.getItem('ebook-lang'); if (sl === 'en' || sl === 'ms') savedLang = sl; } catch (e) {}
  applyLang(savedLang);

  // ---------- Ticker (runs right to left) ----------
  function renderTicker() {
    var box = document.getElementById('ticker');
    var track = document.getElementById('tickerTrack');
    var items = (STATE.on === false ? [] : (STATE.ann || [])).map(function (a) {
      return (LANG === 'en' && a.en) ? a.en : a.ms;
    }).filter(Boolean);
    if (!items.length) { box.classList.remove('on'); track.textContent = ''; return; }
    var text = items.join('   \u25C6   ');
    track.textContent = text;
    track.style.setProperty('--dur', Math.max(14, Math.round(text.length * 0.22 + 8)) + 's');
    box.classList.add('on');
  }

  // ---------- Admin panel (owner only) ----------
  function buildHtml(state) {
    var stateJson = JSON.stringify(state).replace(/</g, '\\u003c');
    return '<!DOCTYPE html>\n<html lang="ms">\n<head>\n' + HEAD_STATIC +
      '\n<style id="css">' + document.getElementById('css').textContent + '</style>\n</head>\n<body>\n' +
      '<template id="body-tpl">' + document.getElementById('body-tpl').innerHTML + '</template>\n' +
      '<script type="application/json" id="state">' + stateJson + '<\/script>\n' +
      '<script id="app">' + document.getElementById('app').textContent + '<\/script>\n</body>\n</html>';
  }
  window.__buildHtml = buildHtml;

  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // ----- ID + kata laluan (hash disimpan dalam e-book, bukan teks biasa) -----
  var ITER = 150000;
  function toB64(buf) {
    var a = new Uint8Array(buf), s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function fromB64(str) {
    var s = atob(str), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function derive(id, pass, salt, iter) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(id.trim().toLowerCase() + '\u0000' + pass), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, k, 256); })
      .then(toB64);
  }
  function isUnlocked() { try { return sessionStorage.getItem('ebook-admin') === '1'; } catch (e) { return false; } }
  function setUnlocked(v) { try { if (v) sessionStorage.setItem('ebook-admin', '1'); else sessionStorage.removeItem('ebook-admin'); } catch (e) {} }

  function publishState(state, status, btn) {
    status.textContent = 'Menerbitkan...';
    if (btn) btn.disabled = true;
    return window.claude.use('artifact').then(function (art) {
      if (!art) { var e = new Error('no artifact'); e.code = 'not_granted'; throw e; }
      return art.publish(buildHtml(state));
    }).catch(function (e) {
      if (btn) btn.disabled = false;
      var c = e && e.code;
      status.textContent = c === 'conflict' ? 'Ada versi baharu diterbitkan. Halaman akan dimuat semula.'
        : (c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled' || c === 'not_declared') ? 'Akaun ini tiada kebenaran untuk menerbitkan.'
        : c === 'rate_limited' ? 'Terlalu kerap. Cuba sebentar lagi.'
        : 'Gagal menerbitkan. Cuba lagi.';
    });
  }

  // ----- Skrin log masuk / cipta ID -----
  var fails = 0, lockUntil = 0;
  function closeOverlay() { var o = document.getElementById('loginOv'); if (o && o.parentNode) o.parentNode.removeChild(o); }
  function field(card, id, label, type, ac) {
    var f = h('div', 'field');
    var l = h('label', null, label); l.setAttribute('for', id);
    var i = document.createElement('input'); i.id = id; i.type = type; i.setAttribute('autocomplete', ac);
    f.appendChild(l); f.appendChild(i); card.appendChild(f); return i;
  }
  function showLogin() {
    closeOverlay();
    var ov = h('div', 'login-ov'); ov.id = 'loginOv'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    var card = h('form', 'login-card'); card.noValidate = true;
    card.appendChild(h('h3', null, 'Log masuk admin'));
    card.appendChild(h('p', null, 'Masukkan ID dan kata laluan untuk membuka panel admin.'));
    var idI = field(card, 'lgId', 'ID', 'text', 'username');
    var pwI = field(card, 'lgPw', 'Kata laluan', 'password', 'current-password');
    var status = h('p', 'admin-status'); status.setAttribute('aria-live', 'polite');
    var row = h('div', 'row');
    var go = h('button', 'btn', 'Log masuk'); go.type = 'submit';
    var cancel = h('button', 'btn ghost', 'Batal'); cancel.type = 'button';
    row.appendChild(go); row.appendChild(cancel);
    card.appendChild(row); card.appendChild(status);
    cancel.addEventListener('click', closeOverlay);
    card.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var wait = Math.ceil((lockUntil - Date.now()) / 1000);
      if (wait > 0) { status.textContent = 'Terlalu banyak cubaan. Tunggu ' + wait + ' saat.'; return; }
      if (!idI.value.trim() || !pwI.value) { status.textContent = 'Isi ID dan kata laluan.'; return; }
      go.disabled = true; status.textContent = 'Menyemak...';
      derive(idI.value, pwI.value, fromB64(STATE.auth.s), STATE.auth.i).then(function (hh) {
        go.disabled = false;
        if (hh === STATE.auth.h) { setUnlocked(true); closeOverlay(); openPanel(); return; }
        pwI.value = ''; fails++;
        if (fails >= 5) { fails = 0; lockUntil = Date.now() + 30000; status.textContent = 'Terlalu banyak cubaan. Tunggu 30 saat.'; }
        else status.textContent = 'ID atau kata laluan salah.';
      }).catch(function () { go.disabled = false; status.textContent = 'Tidak dapat menyemak kata laluan pada peranti ini.'; });
    });
    ov.appendChild(card); document.body.appendChild(ov); idI.focus();
  }
  function showSetup(baseState, changing) {
    closeOverlay();
    var ov = h('div', 'login-ov'); ov.id = 'loginOv'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    var card = h('form', 'login-card'); card.noValidate = true;
    card.appendChild(h('h3', null, changing ? 'Tukar ID dan kata laluan' : 'Cipta ID dan kata laluan admin'));
    card.appendChild(h('p', null, 'Pilih ID dan kata laluan yang kuat (sekurang-kurangnya 8 aksara). Jangan kongsi dengan sesiapa.'));
    var idI = field(card, 'lgId', 'ID baharu', 'text', 'username');
    var pwI = field(card, 'lgPw', 'Kata laluan baharu', 'password', 'new-password');
    var pw2 = field(card, 'lgPw2', 'Sahkan kata laluan', 'password', 'new-password');
    var status = h('p', 'admin-status'); status.setAttribute('aria-live', 'polite');
    var row = h('div', 'row');
    var go = h('button', 'btn', 'Simpan dan terbitkan'); go.type = 'submit';
    var cancel = h('button', 'btn ghost', 'Batal'); cancel.type = 'button';
    row.appendChild(go); row.appendChild(cancel);
    card.appendChild(row); card.appendChild(status);
    cancel.addEventListener('click', closeOverlay);
    card.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (idI.value.trim().length < 3) { status.textContent = 'ID mesti sekurang-kurangnya 3 aksara.'; return; }
      if (pwI.value.length < 8) { status.textContent = 'Kata laluan mesti sekurang-kurangnya 8 aksara.'; return; }
      if (pwI.value !== pw2.value) { status.textContent = 'Kata laluan tidak sama.'; return; }
      go.disabled = true; status.textContent = 'Menyimpan...';
      var salt = new Uint8Array(16); crypto.getRandomValues(salt);
      derive(idI.value, pwI.value, salt, ITER).then(function (hh) {
        var st = clone(baseState);
        st.auth = { s: toB64(salt), h: hh, i: ITER };
        setUnlocked(true);
        return publishState(st, status, go);
      }).catch(function () { go.disabled = false; status.textContent = 'Tidak dapat menyimpan kata laluan pada peranti ini.'; });
    });
    ov.appendChild(card); document.body.appendChild(ov); idI.focus();
  }

  // ----- Panel pengumuman (selepas log masuk) -----
  var panelApi = null;
  function openPanel() {
    if (!panelApi) panelApi = buildPanel();
    panelApi.show();
  }
  function buildPanel() {
    var draft = clone(STATE);
    if (!draft.ann) draft.ann = [];
    if (draft.on === undefined) draft.on = true;

    var panel = h('div', 'admin-panel'); panel.id = 'adminPanel'; panel.hidden = true;
    var inner = h('div', 'admin-inner'); panel.appendChild(inner);
    inner.appendChild(h('h3', null, 'Panel admin: Pengumuman'));
    inner.appendChild(h('p', null, 'Pengumuman bergerak dari kanan ke kiri di bahagian atas e-book.'));

    var onLabel = h('label', 'check');
    var onBox = document.createElement('input'); onBox.type = 'checkbox'; onBox.checked = draft.on !== false;
    onLabel.appendChild(onBox); onLabel.appendChild(h('span', null, ' Papar ticker pengumuman'));
    inner.appendChild(onLabel);

    var list = h('div'); list.id = 'annList'; inner.appendChild(list);

    function fieldTA(id, label, ph) {
      var f = h('div', 'field');
      var l = h('label', null, label); l.setAttribute('for', id);
      var ta = document.createElement('textarea'); ta.id = id; ta.maxLength = 200; ta.placeholder = ph;
      f.appendChild(l); f.appendChild(ta); inner.appendChild(f); return ta;
    }
    var taMs = fieldTA('annMs', 'Pengumuman (BM)', 'Tulis pengumuman anda di sini');
    var taEn = fieldTA('annEn', 'Announcement (English, pilihan)', 'Pilihan: versi Inggeris untuk pembaca EN');

    var status = h('p', 'admin-status'); status.setAttribute('aria-live', 'polite');
    var row = h('div', 'row');
    var addBtn = h('button', 'btn ghost', 'Tambah pengumuman'); addBtn.type = 'button';
    var pubBtn = h('button', 'btn', 'Terbitkan'); pubBtn.type = 'button'; pubBtn.id = 'annPublish';
    row.appendChild(addBtn); row.appendChild(pubBtn);
    inner.appendChild(row);
    var row2 = h('div', 'row');
    var credBtn = h('button', 'btn ghost', 'Tukar ID dan kata laluan'); credBtn.type = 'button';
    var outBtn = h('button', 'btn ghost', 'Log keluar'); outBtn.type = 'button';
    var closeBtn = h('button', 'btn ghost', 'Tutup'); closeBtn.type = 'button';
    row2.appendChild(credBtn); row2.appendChild(outBtn); row2.appendChild(closeBtn);
    inner.appendChild(row2); inner.appendChild(status);

    function renderList() {
      list.textContent = '';
      if (!draft.ann.length) list.appendChild(h('p', null, 'Belum ada pengumuman.'));
      draft.ann.forEach(function (a, i) {
        var r = h('div', 'ann-row');
        var t = h('div', 't', a.ms);
        if (a.en) t.appendChild(h('small', null, 'EN: ' + a.en));
        t.appendChild(h('small', null, a.d || ''));
        var del = h('button', 'btn ghost', '\u2715'); del.type = 'button';
        del.setAttribute('aria-label', 'Padam pengumuman');
        del.addEventListener('click', function () { draft.ann.splice(i, 1); renderList(); });
        r.appendChild(t); r.appendChild(del); list.appendChild(r);
      });
    }
    function addCurrent() {
      var ms = taMs.value.trim(), en = taEn.value.trim();
      if (!ms) return true;
      if (draft.ann.length >= 5) { status.textContent = 'Maksimum 5 pengumuman. Padam satu dahulu.'; return false; }
      draft.ann.push({ id: Date.now().toString(36), ms: ms, en: en, d: new Date().toISOString().slice(0, 10) });
      taMs.value = ''; taEn.value = ''; status.textContent = ''; renderList(); return true;
    }
    addBtn.addEventListener('click', addCurrent);
    closeBtn.addEventListener('click', function () { panel.hidden = true; });
    outBtn.addEventListener('click', function () { setUnlocked(false); panel.hidden = true; });
    credBtn.addEventListener('click', function () {
      if (!addCurrent()) return;
      draft.on = onBox.checked;
      showSetup(draft, true);
    });
    pubBtn.addEventListener('click', function () {
      if (!addCurrent()) return;
      draft.on = onBox.checked;
      publishState(draft, status, pubBtn);
    });
    renderList();
    document.body.appendChild(panel);
    return { show: function () { panel.hidden = false; } };
  }

  function openAdmin() {
    if (!STATE.auth) showSetup(STATE, false);
    else if (isUnlocked()) openPanel();
    else showLogin();
  }

  // ----- Ikon tetapan (hanya untuk pemilik) di sebelah butang tema -----
  function buildGear() {
    var actions = document.querySelector('.bar-actions');
    if (!actions || document.getElementById('settingsBtn')) return;
    var bar = document.querySelector('.bar');
    var gear = h('button', 'btn ghost', '\u2699'); gear.type = 'button'; gear.id = 'settingsBtn';
    gear.setAttribute('aria-label', 'Tetapan'); gear.setAttribute('aria-haspopup', 'true'); gear.setAttribute('aria-expanded', 'false');
    var menu = h('div', 'settings-menu'); menu.id = 'settingsMenu'; menu.hidden = true;
    var item = h('button', 'btn ghost', 'Panel admin'); item.type = 'button'; item.id = 'openAdmin';
    menu.appendChild(item);
    function setMenu(open) { menu.hidden = !open; gear.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    gear.addEventListener('click', function (ev) { ev.stopPropagation(); setMenu(menu.hidden); });
    item.addEventListener('click', function () { setMenu(false); openAdmin(); });
    document.addEventListener('click', function (ev) { if (!menu.hidden && !menu.contains(ev.target)) setMenu(false); });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { setMenu(false); closeOverlay(); } });
    actions.appendChild(gear);
    bar.appendChild(menu);
  }

  function setupAdmin() {
    if (!window.claude || !window.claude.use) return;
    window.claude.use('user').then(function (u) {
      if (u && typeof u.isOwner === 'function' && u.isOwner()) buildGear();
    }).catch(function () {});
  }
  setupAdmin();
})();
</script>
</body>
